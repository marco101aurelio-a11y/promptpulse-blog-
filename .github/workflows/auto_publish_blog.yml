name: Auto Publicação SEO + GEO (PromptPulse)

on:
  # Roda automaticamente 4x por semana: Segunda, Quarta, Sexta e Sábado às 09:00 (Campo Grande - MS / UTC-4 = 13:00 UTC)
  schedule:
    - cron: '0 13 * * 1,3,5,6'

  # Permite disparar manualmente a qualquer hora na aba Actions do GitHub
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Tema personalizado (opcional — deixe em branco para usar o próximo da fila)'
        required: false
        default: ''
      custom_format:
        description: 'Formato GEO (opcional se informar tema personalizado)'
        required: false
        default: 'A_GUIA_ANSWER_FIRST'
        type: choice
        options:
          - A_GUIA_ANSWER_FIRST
          - B_COMPARATIVO_MATRICIAL
          - C_GLOSSARIO_TECNICO
          - D_PLAYBOOK_VERTICAL
          - E_PROMPTS_E_SKILLS
          - F_BENCHMARK_E_METODO

permissions:
  contents: write

jobs:
  publish-article:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar e publicar próximo artigo SEO + GEO
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GA_PROPERTY_ID: '558342687'
          OPENROUTER_MODEL: 'deepseek/deepseek-chat'
          IMAGE_PROVIDER: 'dalle'
          DEFAULT_LANGUAGE: 'pt'
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
          CUSTOM_FORMAT: ${{ github.event.inputs.custom_format || 'A_GUIA_ANSWER_FIRST' }}
        run: python main.py

      - name: Commit e Push automático para disparo na Vercel
        run: |
          git config user.name "PromptPulse Auto Bot"
          git config user.email "bot@promptpulse.com.br"
          git add blog-web/content/posts/ blog-web/public/covers/ blog-web/public/llms-full.txt
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nova para commitar."
          else
            git commit -m "feat(auto-blog): novo artigo SEO+GEO publicado automaticamente ($(date +%Y-%m-%d))"
            git push origin main
          fi
